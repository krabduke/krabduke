<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 160" width="1200" height="160" role="img" aria-label="Keenan Casalegno — robotics, AI, market microstructure">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0B1412"/><stop offset="1" stop-color="#070C0B"/></linearGradient>
    <pattern id="g1" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#12201C" stroke-width="1"/></pattern>
    <pattern id="g2" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M10 0H0V10" fill="none" stroke="#0F1A17" stroke-width="0.6"/></pattern>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1E5C49" stop-opacity="0.5"/><stop offset="1" stop-color="#1E5C49" stop-opacity="0"/></linearGradient>
    <linearGradient id="rule" gradientUnits="userSpaceOnUse" x1="74" y1="0" x2="620" y2="0"><stop offset="0" stop-color="#4FA98A"/><stop offset="0.7" stop-color="#4FA98A" stop-opacity="0.15"/><stop offset="1" stop-color="#4FA98A" stop-opacity="0"/></linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
  </defs>
  <rect width="1200" height="160" fill="url(#bg)"/>
  <rect width="1200" height="160" fill="url(#g2)"/>
  <rect width="1200" height="160" fill="url(#g1)"/>
  <ellipse cx="210" cy="80" rx="300" ry="95" fill="url(#glow)" filter="url(#soft)"><animate attributeName="opacity" values="0.75;1;0.75" dur="12s" repeatCount="indefinite"/></ellipse>
  <path d="M9 0 H21 M0 9 V21" stroke="#1C2E29" stroke-width="1" fill="none"/>
  <path d="M1191 0 H1179 M1200 9 V21" stroke="#1C2E29" stroke-width="1" fill="none"/>
  <path d="M9 160 H21 M0 151 V139" stroke="#1C2E29" stroke-width="1" fill="none"/>
  <path d="M1191 160 H1179 M1200 151 V139" stroke="#1C2E29" stroke-width="1" fill="none"/>
  <rect x="0" y="0" width="1.5" height="160" fill="#4FA98A" opacity="0.2"><animate attributeName="x" values="-10;1210" dur="12s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.24;0.24;0" keyTimes="0;0.1;0.8;1" dur="12s" repeatCount="indefinite"/></rect>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
