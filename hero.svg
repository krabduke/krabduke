<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Keenan Casalegno">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1412"/>
      <stop offset="1" stop-color="#070C0B"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#12201C" stroke-width="1"/>
    </pattern>
    <pattern id="gridfine" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M10 0H0V10" fill="none" stroke="#0F1A17" stroke-width="0.6"/>
    </pattern>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1E5C49" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1E5C49" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4FA98A"/>
      <stop offset="0.7" stop-color="#4FA98A" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#4FA98A" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#gridfine)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>

  <ellipse cx="210" cy="150" rx="300" ry="130" fill="url(#glow)" filter="url(#soft)">
    <animate attributeName="opacity" values="0.75;1;0.75" dur="11s" repeatCount="indefinite"/>
  </ellipse>

