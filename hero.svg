  <!-- sweep -->
  <rect x="0" y="0" width="1.5" height="300" fill="#4FA98A" opacity="0.25">
    <animate attributeName="x" values="-10;1210" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.28;0.28;0" keyTimes="0;0.1;0.8;1" dur="10s" repeatCount="indefinite"/>
  </rect>

  <!-- text block -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="72" y="132" fill="#E9F2EE" font-size="52" letter-spacing="7" font-weight="600">KEENAN</text>
    <text x="72" y="192" fill="#E9F2EE" font-size="52" letter-spacing="7" font-weight="600" opacity="0.42">CASALEGNO</text>

    <line x1="74" y1="222" x2="560" y2="222" stroke="url(#rule)" stroke-width="2" pathLength="100"
          stroke-dasharray="100" stroke-dashoffset="100">
      <animate attributeName="stroke-dashoffset" from="100" to="0" dur="1.6s" begin="0.3s" fill="freeze"/>
    </line>

    <text x="74" y="252" fill="#7E918B" font-size="14.5" letter-spacing="2.2">PARAMETRIC CAD</text>
    <text x="222" y="252" fill="#3F514C" font-size="14.5" letter-spacing="2.2">/</text>
