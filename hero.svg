    <text x="74" y="148" fill="#7E918B" font-size="13.5" letter-spacing="2.4">ROBOTICS · AI · MARKET MICROSTRUCTURE</text>
    <text x="74" y="26" fill="#3A4A44" font-size="9.5" letter-spacing="2.8">KRABDUKE</text>
